<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px Arial;background:#f4f6fa;color:#172747;max-width:760px;margin:24px auto;padding:0 16px}header,section{background:white;border:1px solid #dde3ed;border-radius:12px;padding:20px;margin-bottom:16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccd5e3;border-radius:8px;width:100%;box-sizing:border-box}button{background:#1c3158;color:white;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{padding:12px;border-bottom:1px solid #eee}#msg{padding:12px;background:#eef3f8;border-radius:8px;overflow-wrap:anywhere}</style></head><body><header><h1>Universo IF Avalia</h1><p>Protótipo acadêmico. Não é votação oficial.</p></header><section><h2>Avaliar projeto</h2><label>Projeto<select id="projeto"></select></label><label>Código<input id="codigo" type="password" autocomplete="off"></label><div id="notas" class="grid"></div><p id="previa">Nota ponderada: --</p><button onclick="enviar()">Confirmar avaliação</button><p id="msg" role="status"></p></section><section><h2>Ranking público</h2><div id="ranking">Carregando...</div></section><script>const criterios=['Criatividade e inovação','Clareza da apresentação','Relevância e impacto','Demonstração e resultados'],pesos=[.3,.3,.25,.15];function nota(){const n=criterios.map((_,i)=>{const x=document.querySelector('[name=c'+i+']:checked');return x?Number(x.value):0});document.getElementById('previa').textContent='Nota ponderada: '+(n.every(Boolean)?n.reduce((s,x,i)=>s+x*pesos[i],0).toFixed(2):'--');return n;}function carregar(){google.script.run.withSuccessHandler(p=>{document.getElementById('projeto').innerHTML='';p.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.titulo;document.getElementById('projeto').append(o)});document.getElementById('notas').innerHTML=criterios.map((c,i)=>'<fieldset><legend>'+c+'</legend>'+[1,2,3,4,5].map(n=>'<label><input style="width:auto" type="radio" name="c'+i+'" value="'+n+'" onchange="nota()"> '+n+'</label>').join('')+'</fieldset>').join('');}).withFailureHandler(e=>mensagem(e.message)).listarProjetosPublicos();google.script.run.withSuccessHandler(r=>{const el=document.getElementById('ranking');el.textContent='';r.forEach(x=>{const d=document.createElement('div');d.className='row';d.textContent=x.titulo+' · '+(x.quantidade<5?'Aguardando amostra mínima':x.media_final.toFixed(2))+' · '+x.quantidade+' avaliações';el.append(d)})}).withFailureHandler(e=>document.getElementById('ranking').textContent=e.message).getRanking();}function mensagem(s){document.getElementById('msg').textContent=s;}function enviar(){const n=nota(),p={id_requisicao:crypto.randomUUID(),codigo:document.getElementById('codigo').value,id_projeto:document.getElementById('projeto').value,notas:n};if(!p.codigo||n.some(x=>!x)){mensagem('Preencha código e quatro notas.');return;}google.script.run.withSuccessHandler(r=>mensagem(r.ok?'Avaliação registrada. Recibo: '+r.recibo:r.erro)).withFailureHandler(e=>mensagem(e.message)).submitVote(p);}carregar();</script></body></html>
